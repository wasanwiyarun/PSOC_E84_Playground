CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
# Zephyr's LVGL allocator is separate from the kernel heap and LV_MEM_SIZE.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_ASSERT=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="GFX_MEM"
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_ALIGN=128
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CRC=y
CONFIG_LV_FONT_MONTSERRAT_28=y
